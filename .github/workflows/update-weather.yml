# 서울 날씨를 1시간마다 받아 data/weather.json 으로 저장합니다.
# API 키는 레포 Settings > Secrets and variables > Actions 의
# OPENWEATHER_API_KEY 에 보관하므로 공개 코드에는 노출되지 않습니다.
name: Update Seoul weather

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (UTC 기준, 정각 혼잡 회피)
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch weather
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          if [ -z "$OPENWEATHER_API_KEY" ]; then
            echo "::error::OPENWEATHER_API_KEY secret 이 없습니다."; exit 1
          fi
          mkdir -p data
          curl -sS --fail -o raw.json \
            "https://api.openweathermap.org/data/2.5/weather?q=Seoul,KR&units=metric&lang=kr&appid=${OPENWEATHER_API_KEY}"
          # 필요한 값만 추려서 저장 (원본 응답은 저장하지 않음)
          jq '{
            city: "서울",
            temp: (.main.temp | round),
            feels_like: (.main.feels_like | round),
            temp_min: (.main.temp_min | round),
            temp_max: (.main.temp_max | round),
            humidity: .main.humidity,
            description: .weather[0].description,
            icon: .weather[0].icon,
            observed_at: .dt,
            fetched_at: now | floor
          }' raw.json > data/weather.json
          rm raw.json
          cat data/weather.json

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "chore(weather): update Seoul weather"
          git push
