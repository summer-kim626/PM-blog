# 새 글(posts/*.html)이 추가되면 AI 요약·카드뉴스를 만들어 data/cardnews/ 에 커밋합니다. (F1·F5)
# - 자동 실행: 새로 "추가된" 글만 처리합니다. 기존 글을 고쳐도 다시 만들지 않습니다.
# - 수동 실행(재생성): Actions 탭 > Generate cardnews > Run workflow 에서 slug를 넣습니다.
# API 키는 레포 Settings > Secrets and variables > Actions 의 GEMINI_API_KEY 에 보관합니다.
name: Generate cardnews

on:
  push:
    branches: [main]
    paths: ["posts/*.html"]
  workflow_dispatch:
    inputs:
      slug:
        description: "다시 만들 글의 slug (예: 2026-11-18-start-pm-blog)"
        required: true
      skip_ai:
        description: "AI를 부르지 않고 PNG만 다시 그리기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cardnews
  cancel-in-progress: false # 앞선 생성이 끝날 때까지 기다린다 (중간에 끊으면 결과가 사라짐)

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 푸시 전후 비교(git diff)에 필요

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Find posts
        id: posts
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # 입력값은 정해진 형식만 허용한다 (경로 조작 방지)
            if ! echo "$INPUT_SLUG" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$'; then
              echo "::error::slug 형식이 올바르지 않습니다: $INPUT_SLUG"; exit 1
            fi
            FILES="posts/$INPUT_SLUG.html"
            [ -f "$FILES" ] || { echo "::error::$FILES 파일이 없습니다."; exit 1; }
          else
            # 이번 푸시에서 새로 추가된 글만 고른다
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              FILES=$(git diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD -- 'posts/*.html')
            else
              FILES=$(git diff --name-only --diff-filter=A "$BEFORE" HEAD -- 'posts/*.html')
            fi
          fi
          FILES=$(echo $FILES) # 한 줄로
          SLUGS=$(for f in $FILES; do basename "$f" .html; done | xargs)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
          echo "count=$(echo $FILES | wc -w | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "대상: ${FILES:-없음 (수정된 글만 있음)}"

      - name: Generate (F2~F5)
        id: gen
        if: steps.posts.outputs.count != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FILES: ${{ steps.posts.outputs.files }}
          SKIP_AI: ${{ inputs.skip_ai }}
        run: |
          if [ "$SKIP_AI" != "true" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret 이 없습니다."; exit 1
          fi
          set +e
          node scripts/cardnews/run.mjs $FILES $([ "$SKIP_AI" = "true" ] && echo --skip-ai)
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      # 실패해도 index.json의 실패 상태는 커밋해 관리자 페이지에서 볼 수 있게 한다
      - name: Commit (F5)
        if: steps.posts.outputs.count != '0' && steps.gen.outcome == 'success'
        env:
          SLUGS: ${{ steps.posts.outputs.slugs }}
          COUNT: ${{ steps.posts.outputs.count }}
          GEN_EXIT: ${{ steps.gen.outputs.exit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cardnews
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          if [ "$COUNT" = "1" ]; then TARGET="$SLUGS"; else TARGET="글 ${COUNT}편"; fi
          if [ "$GEN_EXIT" = "0" ]; then MSG="chore(cardnews): $TARGET 카드뉴스 생성"; else MSG="chore(cardnews): $TARGET 카드뉴스 생성 실패 기록"; fi
          git commit -m "$MSG"
          # 날씨 봇이 1시간마다 커밋하므로 rebase 후 푸시, 실패하면 1회 재시도
          for i in 1 2; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "푸시 실패, 재시도 ($i)"; sleep 5
          done
          echo "::error::푸시에 실패했습니다."; exit 1

      - name: Result
        if: steps.gen.outputs.exit != '' && steps.gen.outputs.exit != '0'
        run: |
          echo "::error::카드뉴스 생성에 실패한 글이 있습니다. data/cardnews/index.json 의 error를 확인하세요."
          exit 1
